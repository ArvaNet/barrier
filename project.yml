# XcodeGen spec. `xcodegen generate` builds Barrier.xcodeproj from this file.
# The generated project is committed too, so a Mac only needs Xcode.
#
# To run on your iPhone: open Barrier.xcodeproj, pick your Team on the
# Barrier and BarrierWidget targets (Signing & Capabilities), plug in the
# phone, press Run. If the bundle id is taken, change BUNDLE_PREFIX below.

name: Barrier

options:
  bundleIdPrefix: com.arvanet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  defaultConfig: Debug

settings:
  base:
    BUNDLE_PREFIX: com.arvanet.barrier
    APP_GROUP: group.com.arvanet.barrier
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_EMIT_LOC_STRINGS: NO

packages:
  BarrierCore:
    path: Packages/BarrierCore

targets:
  Barrier:
    type: application
    platform: iOS
    sources:
      - path: Barrier
      - path: Shared
    dependencies:
      - package: BarrierCore
      - target: BarrierWidget
        embed: true
    entitlements:
      path: Barrier/Barrier.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP)
    info:
      path: Barrier/Info.plist
      properties:
        CFBundleDisplayName: Barrier
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BarrierAppGroup: $(APP_GROUP)
        LSApplicationCategoryType: public.app-category.health-fitness
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Fraunces.ttf
        NSCameraUsageDescription: Barrier uses the camera for your progress photos. They stay on this iPhone.
        NSPhotoLibraryAddUsageDescription: Lets you save a progress photo or your report to Photos.
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - barrier
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault

  BarrierWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BarrierWidget
      - path: Shared
      - path: Barrier/Resources/Fonts/Fraunces.ttf
        buildPhase: resources
    dependencies:
      - package: BarrierCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: BarrierWidget/BarrierWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP)
    info:
      path: BarrierWidget/Info.plist
      properties:
        CFBundleDisplayName: Barrier
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BarrierAppGroup: $(APP_GROUP)
        UIAppFonts:
          - Fraunces.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).widget
        SKIP_INSTALL: YES

schemes:
  Barrier:
    build:
      targets:
        Barrier: all
        BarrierWidget: all
    run:
      config: Debug
    archive:
      config: Release
